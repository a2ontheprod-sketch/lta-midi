
name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows VST3 64-bit
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build plugin and tests
        run: cmake --build build --config Release --target LTAHarmony_VST3 LTAHarmonyEngineTests --parallel 4

      - name: Test MIDI generator
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item "build/LTAHarmony_artefacts/Release/VST3/*.vst3" "dist/windows/" -Recurse -Force
          Copy-Item "scripts/INSTALL_WINDOWS.txt" "dist/windows/INSTALL_WINDOWS.txt"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: LTA-Harmony-Windows-VST3
          path: dist/windows/
          if-no-files-found: error
